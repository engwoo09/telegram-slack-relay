name: relay

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: relay-state-${{ github.run_id }}
          restore-keys: relay-state-

      - name: Relay
        env:
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python relay.py --state state.json

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: relay-state-${{ github.run_id }}

      # Scheduled workflows in public repos are auto-disabled after 60 days without activity.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/relay.yml/enable" --silent
