name: relay

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      rewind:
        description: "시험용: 채널마다 마지막 N건을 다시 전송 (0 = 평소대로)"
        default: "0"

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: relay-state-${{ github.run_id }}
          restore-keys: relay-state-

      - name: Relay
        env:
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REWIND: ${{ inputs.rewind || '0' }}
        run: python relay.py --state state.json --rewind "$REWIND"

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: relay-state-${{ github.run_id }}

      # Scheduled workflows in public repos are auto-disabled after 60 days without activity.
      # Calling enable on every run could re-register the schedule, so only do it once a day.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/relay.yml/enable" --silent
          fi
